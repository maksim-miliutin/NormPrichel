name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The windows runner's default shell is PowerShell, where $(...) means something else.
      - name: format
        shell: bash
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: go vet -tags integration ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      # The Go code under test is the same on both runners, so one race run is enough.
      - name: race
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...
