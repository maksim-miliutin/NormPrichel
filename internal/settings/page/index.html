<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>NormPrichel</title>
	<link rel="stylesheet" href="style.css">
	<script src="app.js" defer></script>
</head>
<body>
	<h1>NormPrichel</h1>
	<label><input type="checkbox" id="visible"> <span data-text="visible"></span></label>
	<p id="problem" role="alert" hidden></p>

	<h2 data-text="games"></h2>
	<ul id="games"></ul>
	<p id="no-games" class="hint" data-text="noGames" hidden></p>
	<button type="button" id="add-game" data-text="addGame"></button>
	<div id="adding" hidden>
		<p class="hint" data-text="chooseWindow"></p>
		<ul id="windows"></ul>
		<p id="no-windows" class="hint" data-text="noWindows" hidden></p>
		<button type="button" id="refresh-windows" data-text="refresh"></button>
		<button type="button" id="cancel-adding" data-text="cancel"></button>
	</div>

	<div id="game" hidden>
		<p>
			<label><span data-text="name"></span> <input type="text" id="game-name" maxlength="80"></label>
			<span id="game-exe" class="exe"></span>
		</p>
		<p>
			<label><input type="checkbox" id="game-enabled"> <span data-text="enabled"></span></label>
			<button type="button" id="remove-game" data-text="remove"></button>
		</p>

		<h2 data-text="preview"></h2>
		<div class="preview dark"><img id="preview-dark" alt=""></div>
		<div class="preview light"><img id="preview-light" alt=""></div>

		<h2 data-text="crosshair"></h2>
		<p role="tablist">
			<button type="button" id="kind-ready" role="tab" data-text="readyMade"></button>
			<button type="button" id="kind-picture" role="tab" data-text="picture"></button>
		</p>
		<div id="ready">
			<div id="shapes"></div>
			<p><label><span data-text="color"></span> <input type="color" id="color"></label></p>
			<div id="sliders"></div>
			<p><label><span data-text="outlineColor"></span> <input type="color" id="outline-color"></label></p>
		</div>
		<div id="picture" hidden>
			<p class="hint" data-text="uploadHint"></p>
			<label class="upload"><input type="file" id="file" accept="image/png"><span data-text="upload"></span></label>
			<label class="field">
				<span class="caption"><span data-text="scale"></span><output id="scale-value"></output></span>
				<input type="range" id="scale" min="25" max="400" step="25">
			</label>
		</div>

		<h2 data-text="position"></h2>
		<p class="hint" data-text="positionHint"></p>
		<p>
			<label>X <input type="number" id="offset-x" min="-500" max="500"></label>
			<label>Y <input type="number" id="offset-y" min="-500" max="500"></label>
		</p>
		<p>
			<span class="pad"><button type="button" data-x="-1" data-y="0">←</button><button type="button" data-x="0" data-y="-1">↑</button><button type="button" data-x="0" data-y="1">↓</button><button type="button" data-x="1" data-y="0">→</button></span>
			<label><span data-text="step"></span> <select id="step"><option value="1">1</option><option value="10">10</option></select></label>
			<button type="button" id="centre" data-text="centre"></button>
		</p>

		<h2 data-text="saved"></h2>
		<ul id="saved"></ul>
		<p id="no-saved" class="hint" data-text="noSaved" hidden></p>
		<p>
			<label><span data-text="saveAs"></span> <input type="text" id="save-name" maxlength="60"></label>
			<button type="button" id="save" data-text="saveCurrent"></button>
		</p>
	</div>

	<h2 data-text="hotkeys"></h2>
	<p class="hint" data-text="hotkeysHint"></p>
	<div id="hotkeys"></div>

	<h2 data-text="about"></h2>
	<p data-text="borderless"></p>
	<p class="warning" data-text="risk"></p>
	<p>
		<span data-text="version"></span> <span id="version"></span>
		· <a href="https://github.com/maksim-miliutin/NormPrichel" target="_blank" rel="noreferrer noopener">GitHub</a>
	</p>
</body>
</html>
